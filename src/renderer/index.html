<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
  <title>XtremeLED Remap Export</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="toolbar">
    <div class="brand">Xtreme<span>LED</span>&nbsp;Remap&nbsp;Export</div>
    <div class="tb-group">
      <button id="btn-new" title="Nieuw project">New</button>
      <button id="btn-open-proj" title="Project openen (.xreproj)">Open…</button>
      <button id="btn-save-proj" title="Project opslaan (.xreproj)">Save</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <button id="btn-import-xml" title="Resolume Advanced Output XML importeren">Import XML</button>
      <button id="btn-export-xml" title="Exporteren als Resolume-compatible XML">Export XML</button>
    </div>
    <div class="tb-sep"></div>
    <div class="tabs">
      <button id="tab-input" class="tab active">Input Map</button>
      <button id="tab-output" class="tab">Output Map</button>
    </div>
    <div class="tb-group zoom">
      <button id="btn-zoom-out" title="Uitzoomen">−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="Inzoomen">+</button>
      <button id="btn-zoom-fit" title="Passend zoomen">Fit</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-render" class="accent">Render…</button>
  </header>

  <div id="main">
    <aside id="left">
      <div class="panel-title">Slices</div>
      <div id="slice-list"></div>
      <div class="left-buttons">
        <button id="btn-add-slice">+ Slice</button>
        <button id="btn-dup-slice">Duplicate</button>
        <button id="btn-split-slice">Auto-split…</button>
        <button id="btn-del-slice" class="danger">Delete</button>
      </div>
    </aside>

    <div id="center">
      <canvas id="editor"></canvas>
      <div id="statusbar">
        <span id="status-pos"></span>
        <span id="status-hint">Sleep = verplaats · Handles = schalen · Scroll = pan · ⌘/Ctrl+scroll = zoom</span>
      </div>
    </div>

    <aside id="right">
      <div class="section">
        <div class="panel-title">Project</div>
        <div class="row"><label>Naam</label><input type="text" id="p-name" /></div>
        <div class="subtitle">Input canvas (stageview)</div>
        <div class="row2">
          <label>W</label><input type="number" id="in-w" class="num" min="1" max="32768" />
          <label>H</label><input type="number" id="in-h" class="num" min="1" max="32768" />
        </div>
        <div class="subtitle">Output canvas</div>
        <div class="row2">
          <label>W</label><input type="number" id="out-w" class="num" min="1" max="32768" />
          <label>H</label><input type="number" id="out-h" class="num" min="1" max="32768" />
        </div>
      </div>

      <div class="section">
        <div class="panel-title">Reference — <span id="ref-view-label">Input</span></div>
        <div class="row">
          <button id="btn-ref-load">Load image…</button>
          <button id="btn-ref-clear" title="Reference verwijderen">✕</button>
        </div>
        <div class="row"><span id="ref-name" class="dim">geen afbeelding</span></div>
        <div class="row">
          <label>Opacity</label>
          <input type="range" id="ref-opacity" min="0" max="100" value="60" />
        </div>
      </div>

      <div class="section" id="slice-props">
        <div class="panel-title">Slice</div>
        <div class="row"><label>Naam</label><input type="text" id="sl-name" /></div>
        <div class="row"><label>Enabled</label><input type="checkbox" id="sl-enabled" /></div>
        <div class="subtitle">Input rect</div>
        <div class="row4">
          <label>X</label><input type="number" id="sl-in-x" class="num" />
          <label>Y</label><input type="number" id="sl-in-y" class="num" />
          <label>W</label><input type="number" id="sl-in-w" class="num" />
          <label>H</label><input type="number" id="sl-in-h" class="num" />
        </div>
        <div class="subtitle">Output rect</div>
        <div class="row4">
          <label>X</label><input type="number" id="sl-out-x" class="num" />
          <label>Y</label><input type="number" id="sl-out-y" class="num" />
          <label>W</label><input type="number" id="sl-out-w" class="num" />
          <label>H</label><input type="number" id="sl-out-h" class="num" />
        </div>
      </div>

      <div class="section">
        <div class="panel-title">Engine</div>
        <div id="ffmpeg-info" class="dim">ffmpeg: zoeken…</div>
      </div>
    </aside>
  </div>

  <div id="modal-root" class="hidden"></div>

  <script src="../shared/sxml.js"></script>
  <script src="../shared/resolume.js"></script>
  <script src="app.js"></script>
</body>
</html>
